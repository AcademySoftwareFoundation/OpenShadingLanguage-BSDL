       --bsdf '(0.5,0.1,0) spi::diffuse(Nf)'
       -L -1,1,-0.5 1,1,1 2 1 -L 0,1,1 0.5,0.75,1 180 0.7
       --samples 256 --depth 8
       --ground 0.1,0.1,0.1 0.8,0.8,0.8 1

[toon-dielectric-furnace]
